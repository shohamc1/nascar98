# Builds the EXE, checks it matches, and uploads the objdiff report that
# decomp.dev reads. The local runner holds the retail EXE outside the checkout.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, linux, x64, nascar98]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Prepare local inputs
        run: |
          install -D -m 0644 /baserom/SLUS_005.21 disc/SLUS_005.21
          mkdir -p tools/cc/2.7.2-psx-nascar98
          cp -a /nascar98-cc/. tools/cc/2.7.2-psx-nascar98/
      - name: Fetch tools
        run: make tools
      - name: Check
        run: make check
      - name: Report
        run: make report
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles('build/report.json') != '' }}
        with:
          name: us_report
          path: build/report.json
