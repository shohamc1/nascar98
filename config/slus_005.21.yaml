# splat config for NASCAR 98 (USA), SLUS-00521.
# Run `make split` to regenerate asm/ and the linker script from disc/.
name: SLUS_005.21
sha1: 7397d323f5fff007c7c413b8bb6ce166746a226a
options:
  basename: slus_005.21
  target_path: disc/SLUS_005.21
  elf_path: build/slus_005.21.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/slus_005.21.ld
  ld_dependencies: True
  create_asm_dependencies: True

  find_file_boundaries: False
  gp_value: 0x800A2CE0
  ld_gp_expression: main_sdata_start_OFFSET

  o_as_suffix: False
  ld_bss_is_noload: True
  use_legacy_include_asm: False
  include_asm_macro_style: maspsx_hack
  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Move each function's rodata (jump tables, string literals) into its
  # nonmatching .s file, so decompiling the function moves them into C.
  # Orphan rodata stays in per-symbol .s files reached with INCLUDE_RODATA.
  migrate_rodata_to_functions: True

  # include_asm.h and the .inc files are owned by this repo (tracked in
  # git). INCLUDE_RODATA needs the maspsx function wrapper; splat's
  # generator would overwrite it with a file-scope form that GCC 2.7.2
  # hoists above every function body, reordering .rodata.
  generate_asm_macros_files: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80012000
    align: 4
    bss_size: 0x2B7E0
    subsegments:
      # Game code, written by Stormfront Studios.
      - [0x800, c, game]
      - [0x54D8, c, util]
      - [0x6580, c, primitives_text]
      - [0xAD90, c, list_callbacks]
      - [0xC840, c, images]
      - [0xE428, c, objects]
      - [0x2AD28, c, cd]
      - [0x2D6A4, c, sound]
      - [0x302D0, c, input]
      - [0x31674, c, effects]
      - [0x32EF4, c, heap]
      - [0x333CC, c, scene]
      - [0x4807C, c, memory_card]
      - [0x4C750, c, menu]
      - [0x56734, c, memory_card_menu]
      - [0x5CF70, c, media]
      # Psy-Q runtime and SDK libraries, from __SN_ENTRY_POINT on.
      # tools/psyq_sigs.py identifies the objects (libs 3.5, LIBSND and
      # LIBGTE 3.6).
      - [0x6268C, c, psxsdk/crt0]  # 0x80073E8C
      - [0x6280C, c, psxsdk/libgcc]  # 0x8007400C
      - [0x62ED8, c, psxsdk/libapi]  # 0x800746D8
      - [0x631C0, c, psxsdk/libcd]  # 0x800749C0
      - [0x6597C, c, psxsdk/libetc]  # 0x8007717C
      - [0x666B8, c, psxsdk/libgpu]  # 0x80077EB8
      - [0x6AA28, c, psxsdk/libgs]  # 0x8007C228
      - [0x6AB0C, c, psxsdk/libgte]  # 0x8007C30C
      - [0x6C51C, c, psxsdk/libsnd]  # 0x8007DD1C
      - [0x764C0, c, psxsdk/libspu]  # 0x80087CC0
      - [0x79F90, c, psxsdk/libc]  # 0x8008B790
      - [0x7AA2C, c, psxsdk/libcard]  # 0x8008C22C
      - [0x7AAF4, c, psxsdk/libpress]  # 0x8008C2F4
      # Game rodata, migrated per-function into asm/nonmatchings/game/.
      # 0x7E810 is 0x80090010: the first SDK division table (D_80090010);
      # the game/SDK rodata boundary is inferred, see kb/.
      # Data-only translation unit: a rodata run that follows jump tables.
      - [0x7B250, c, menu_text]
      - [0x7B250, .rodata, game]
      - [0x7B52C, .rodata, util]  # 0x8008CD2C
      - [0x7B57C, .rodata, primitives_text]  # 0x8008CD7C
      - [0x7B714, .rodata, list_callbacks]  # 0x8008CF14
      - [0x7B728, .rodata, objects]  # 0x8008CF28
      - [0x7B910, .rodata, cd]  # 0x8008D110
      - [0x7B9DC, .rodata, sound]  # 0x8008D1DC
      - [0x7BAE4, .rodata, input]  # 0x8008D2E4
      - [0x7BB04, .rodata, scene]  # 0x8008D304
      - [0x7BF38, .rodata, menu_text]  # 0x8008D738
      - [0x7E128, .rodata, memory_card]  # 0x8008F928
      - [0x7E1C0, .rodata, menu]  # 0x8008F9C0
      - [0x7E214, .rodata, memory_card_menu]  # 0x8008FA14
      - [0x7E470, .rodata, media]  # 0x8008FC70
      - [0x7E810, .rodata, psxsdk/libgcc]  # 0x80090010
      - [0x7E910, .rodata, psxsdk/libcd]  # 0x80090110
      - [0x7EC04, .rodata, psxsdk/libetc]  # 0x80090404
      - [0x7ECC4, .rodata, psxsdk/libgpu]  # 0x800904C4
      - [0x7F04C, .rodata, psxsdk/libsnd]  # 0x8009084C
      - [0x7F338, .rodata, psxsdk/libspu]  # 0x80090B38
      - [0x7F440, .rodata, psxsdk/libc]  # 0x80090C40
      - [0x7F51C, .rodata, psxsdk/libpress]  # 0x80090D1C
      # LIBPRESS strings end here; game data starts at 0x80090DC8.
      # This section boundary is inferred; see kb/ for the evidence.
      - [0x7F5C8, data, data]
      # Marker for the former .sdata range start (= _gp, 0x800A2CE0).
      # The sdata bytes are decompiled into src/globals.c, which the
      # linker script collects as the tail of .data; this zero-size
      # subsegment emits sdata_start_OFFSET = . at the right place.
      - [0x914E0, linker_offset, sdata_start]
      # sdata is decompiled into src/globals.c (scalars, format strings,
      # fopen modes, and other literals).
      - [0x914E0, c, globals]
      - { start: 0x91BC0, type: bss, vram: 0x800A33C0, name: bss }
  - [0x92000]
